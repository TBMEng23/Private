name: Build Spinner APK

on:
  push:
    branches: [ spinner ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Signing key
        env:
          TBM_KS_B64: ${{ secrets.TBM_KS_B64 }}
        run: |
          if [ -n "$TBM_KS_B64" ]; then echo "$TBM_KS_B64" | tr -d " \r\n" | base64 -d > app/tbm-release.jks; fi
      - name: Build
        env:
          TBM_KS_PASS: ${{ secrets.TBM_KS_PASS }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          E=$( (grep -E "error:|^e: " build.log; grep -A25 "What went wrong" build.log) | head -120 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::$E"
      - uses: actions/upload-artifact@v4
        with:
          name: Spinner-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to spinner-apk branch
        run: |
          mkdir out && cp app/build/outputs/apk/release/*.apk out/Spinner.apk
          cd out
          git init -q -b spinner-apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Spinner.apk
          git commit -q -m "Spinner APK ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" spinner-apk
