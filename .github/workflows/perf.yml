name: TV perf test

on:
  workflow_dispatch:
  push:
    branches: [ perf ]

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build (release, debug-signed)
        run: gradle assembleRelease --no-daemon -q 2>&1 | tail -20
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Fake Xtream server
        run: nohup python3 perf/fake_xtream.py 8000 > perf-server.log 2>&1 &
      - name: Run on Android 9 TV emulator (low memory)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          ram-size: 1536M
          heap-size: 192M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/release/*.apk
            python3 perf/drive.py all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-out
          path: |
            perf-out/
            perf-server.log
      - name: Publish results to perf-results branch
        if: always()
        run: |
          mkdir -p res && cp -r perf-out/* res/ 2>/dev/null; cp perf-server.log res/ 2>/dev/null; cd res
          git init -q -b perf-results && git config user.name gha && git config user.email gha@x
          git add -A && git commit -q -m "perf ${GITHUB_SHA::7}" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" perf-results
