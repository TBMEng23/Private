name: Compile check

on:
  push:
    branches: [ dev ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile
        run: |
          set -o pipefail
          gradle compileReleaseKotlin --no-daemon 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -40 | while read -r l; do echo "::error::$l"; done
